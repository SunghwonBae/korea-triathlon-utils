<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>V2 데이터 통합기 (정밀 로직)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-10">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">V3 초슬림 데이터 통합</h2>
        <div class="space-y-4 my-6">
            <div class="p-4 border rounded-lg bg-blue-50">
                <label class="block text-xs font-semibold text-blue-600 mb-1">1. all_records.json (신규)</label>
                <input type="file" id="fAll" class="w-full text-sm">
            </div>
            <div class="p-4 border rounded-lg bg-orange-50">
                <label class="block text-xs font-semibold text-orange-600 mb-1">2. ironman_data.json (과거 킹코스)</label>
                <input type="file" id="fOld" class="w-full text-sm">
            </div>
            <div class="p-4 border rounded-lg">
                <label class="block text-xs font-semibold text-slate-600 mb-1">3. race_meta.json (메타 정보)</label>
                <input type="file" id="fMeta" class="w-full text-sm">
            </div>
        </div>

        <button onclick="process()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-black transition">
            📦 V2 규격 통합 데이터 생성
        </button>

        <div id="log" class="mt-6 p-4 bg-gray-900 text-green-400 font-mono text-xs rounded h-48 overflow-y-auto hidden"></div>
    </div>

    <script>
        const print = msg => {
            const el = document.getElementById('log');
            el.classList.remove('hidden');
            el.innerHTML += `> ${msg}<br>`;
            el.scrollTop = el.scrollHeight;
        };

        const read = f => new Promise(res => {
            const r = new FileReader();
            r.onload = e => res(JSON.parse(e.target.result));
            r.readAsText(f);
        });

        async function process() {
            const [fA, fO, fM] = ['fAll', 'fOld', 'fMeta'].map(id => document.getElementById(id).files[0]);
            if(!fA || !fO || !fM) return alert("모든 파일을 업로드해주세요.");

            const [allR, oldD, metaD] = await Promise.all([read(fA), read(fO), read(fM)]);
            const metaIds = new Set(metaD.map(m => m.id));
            const result = [];

            // 1. 신규 데이터 슬림화 (기존 필드 -> 단축 필드)
            allR.forEach(r => {
                result.push({
                    n: r.n, t: r.t, s: r.s, bk: r.bk, r: r.rn, 
                    t1: r.t1, t2: r.t2,
                    rn: r.raceName, y: r.raceYear, rt: r.raceType,
                    b: r.b, d: r.d, c: r.c, q: r.q
                });
            });

            // 2. 과거 데이터 통합 (사용자 지정 로직 적용)
            oldD.forEach(item => {
                if(!item.to || item.to === 0) return;

                // [로직 1] 연도 판별: 9로 시작하면 19, 아니면 20
                let year = "Unknown";
                if(item.rd) {
                    const firstChar = item.rd.charAt(0);
                    const yearPart = item.rd.split('/')[0];
                    year = (firstChar === '9' ? "19" : "20") + yearPart;
                }

                // [로직 2] rn 그대로 사용 및 ID 생성
                const originalRn = (item.rn || "기타").trim();
                const rid = `${originalRn}_${year}`; // 한글 ID도 시스템상 문제없음

                // 메타데이터 자동 추가
                if(!metaIds.has(rid)) {
                    metaD.push({ id: rid, name: rid, year: year, type: "Ironman" });
                    metaIds.add(rid);
                    print(`[신규대회] ${rid}`);
                }

                result.push({
                    n: item.n, t: item.to, s: item.sw, bk: item.bi, r: item.ru,
                    t1: item.t1, t2: item.t2,
                    rn: rid, y: year, rt: "Ironman",
                    b: item.b, d: item.d, c: item.c, q: item.q
                });
            });

            print(`통합 완료: 총 ${result.length}건`);
            
            // 다운로드
            download(result, 'all_records_v2.json');
            setTimeout(() => download(metaD, 'race_meta_v2.json'), 1000);
        }

        function download(d, n) {
            const blob = new Blob([JSON.stringify(d)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = n; a.click();
        }
    </script>
</body>
</html>
