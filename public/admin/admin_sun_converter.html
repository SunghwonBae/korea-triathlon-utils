<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>태양철인 2025 데이터 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        h2 { color: #333; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 600px; }
        #status { margin-top: 15px; font-weight: bold; color: blue; white-space: pre-wrap; }
        .btn { margin-top: 10px; padding: 10px 20px; cursor: pointer; background-color: #ff9800; color: white; border: none; border-radius: 4px; }
        .btn:hover { background-color: #e68900; }
        .info { font-size: 0.9em; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>태양철인 2025 엑셀 → JSON 변환기</h2>
        <p class="info">
            '태양철인순위25 (1).xlsx' 파일을 선택하세요.<br>
            - 통과 시각(S-S, S-F 등) 보존 및 이상치 제거<br>
            - 구간 기록(S-R, B-R 등) 표준화<br>
            - 최종 파일명: sun_2025.json
        </p>
        
        <input type="file" id="excelFile" accept=".xlsx" />
        <br>
        <div id="status">대기 중...</div>
    </div>

    <script>
        document.getElementById('excelFile').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                processWorkbook(workbook);
            };
            reader.readAsArrayBuffer(file);
        }

        function processWorkbook(workbook) {
            // '순위' 시트 또는 첫 번째 시트 사용
            const sheetName = workbook.SheetNames.includes('순위') ? '순위' : workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            
            if (!sheet) {
                document.getElementById('status').innerText = "❌ '순위' 시트를 찾을 수 없습니다.";
                return;
            }

            // 헤더가 포함된 JSON으로 변환
            const rawData = XLSX.utils.sheet_to_json(sheet);
            let log = `[정보] '${sheetName}' 시트에서 ${rawData.length}명의 기록을 읽었습니다.\n`;
            
            let finalRecords = [];

            rawData.forEach((row, index) => {
                // 이름이나 배번호가 없으면 건너뜀
                const name = findValue(row, ['성   명', '성 명', '성명', '이름']);
                const bib = findValue(row, ['배  번', '배 번', '배번']);
                
                if (!name) return;

                // 1. 기본 정보 매핑
                let record = {
                    n: name,
                    b: bib,
                    c: findValue(row, ['지 역', '지역']) || "",
                    d: findValue(row, ['성  별', '성 별', '성별']) || "Unk", // Age Group 정보가 없으면 성별 사용
                    rn: "태양_2025",
                    y: "2025",
                    rt: "Full" // 기본 풀코스로 가정
                };

                // 2. 구간 기록 (Duration) 매핑 - 표준 필드 (초 단위 변환)
                record.s = parseDuration(findValue(row, ['S-R']));
                record.t1 = parseDuration(findValue(row, ['T1']));
                record.bk = parseDuration(findValue(row, ['B-R']));
                record.t2 = parseDuration(findValue(row, ['T2']));
                record.r = parseDuration(findValue(row, ['R-R']));
                record.t = parseDuration(findValue(row, ['T-R', 'TOTAL']));

                // 3. 통과 시각 (Timestamp) 보존 - 축약 키 사용
                // 이상한 데이터(빈값, 유효하지 않은 포맷)는 제외
                addTimestamp(record, 't_st', findValue(row, ['S-S']));       // Swim Start
                addTimestamp(record, 't_s_end', findValue(row, ['S-F']));    // Swim Finish
                addTimestamp(record, 't_b_st', findValue(row, ['B-S']));     // Bike Start
                addTimestamp(record, 't_b_end', findValue(row, ['B-F']));    // Bike Finish
                addTimestamp(record, 't_r_st', findValue(row, ['R-S']));     // Run Start
                addTimestamp(record, 't_fn', findValue(row, ['R-F']));       // Run Finish (Finish Time)

                finalRecords.push(record);
            });

            if (finalRecords.length > 0) {
                saveJSON(finalRecords, "sun_2025.json");
                document.getElementById('status').innerText = log + `\n✅ 완료! 총 ${finalRecords.length}건 변환됨. 다운로드 시작...`;
            } else {
                document.getElementById('status').innerText = log + "\n❌ 변환할 유효한 데이터가 없습니다.";
            }
        }

        // 유연한 키 검색 (공백 차이 등 해결)
        function findValue(row, keyCandidates) {
            for (let key of keyCandidates) {
                if (row[key] !== undefined) return row[key];
                // 공백 제거 후 비교 (헤더에 공백이 불규칙한 경우 대비)
                const cleanKey = key.replace(/\s+/g, '');
                for (let rowKey in row) {
                    if (rowKey.replace(/\s+/g, '') === cleanKey) {
                        return row[rowKey];
                    }
                }
            }
            return undefined;
        }

        // HH:MM:SS 또는 엑셀 시간(0.xxx) -> 초(Seconds)
        function parseDuration(val) {
            if (!val) return 0;
            if (typeof val === 'number') {
                return Math.round(val * 86400); // 1일 = 86400초
            }
            const parts = String(val).trim().split(':');
            if (parts.length < 2) return 0;
            
            let h = parseInt(parts[0]) || 0;
            let m = parseInt(parts[1]) || 0;
            let s = parts[2] ? parseFloat(parts[2]) : 0;
            
            return Math.round(h * 3600 + m * 60 + s);
        }

        // 통과 시각 데이터 검증 및 추가
        function addTimestamp(obj, key, val) {
            if (!val || val === '-' || val === '0' || val === 0) return; // 빈 값 무시
            
            let formattedTime = "";
            
            if (typeof val === 'number') {
                // 엑셀 시간 포맷 (0.xxx) -> HH:MM:SS 변환
                const totalSeconds = Math.round(val * 86400);
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                formattedTime = `${pad(h)}:${pad(m)}:${pad(s)}`;
            } else {
                const strVal = String(val).trim();
                // "HH:MM:SS" 형식인지 간단 체크
                if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(strVal)) {
                    formattedTime = strVal;
                }
            }

            // 유효한 시간이면 추가, 아니면 무시 (이상한 데이터 제외)
            if (formattedTime) {
                obj[key] = formattedTime;
            }
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function saveJSON(data, filename) {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
    </script>
</body>
</html>
