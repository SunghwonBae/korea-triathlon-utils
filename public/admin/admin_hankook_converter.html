<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한국철인 2025 데이터 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        h2 { color: #333; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 600px; }
        #status { margin-top: 15px; font-weight: bold; color: blue; white-space: pre-wrap; }
        .btn { margin-top: 10px; padding: 10px 20px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        .btn:hover { background-color: #218838; }
        .info { font-size: 0.9em; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>한국철인 2025 엑셀 → JSON 변환기</h2>
        <p class="info">
            '25한국철인_기록.xlsx' 파일을 선택하세요.<br>
            - '전체순위' 시트에서 생년월일 추출<br>
            - '남자부순위' / '여자부순위' 시트 통합<br>
            - HH:MM:SS 시간 포맷을 초(Seconds)로 변환
        </p>
        
        <input type="file" id="excelFile" accept=".xlsx" />
        <br>
        <div id="status">대기 중...</div>
    </div>

    <script>
        document.getElementById('excelFile').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                processWorkbook(workbook);
            };
            reader.readAsArrayBuffer(file);
        }

        function processWorkbook(workbook) {
            let log = "";
            
            // 1. 생년월일 매핑 정보 생성 (배번호 -> 출생년도)
            // '전체순위' 시트를 사용 (헤더가 2번째 줄에 있음)
            const bibToBirth = {};
            const allRankSheet = workbook.Sheets['전체순위'];
            
            if (allRankSheet) {
                // range: 1 -> 2번째 줄(Index 1)부터 데이터 시작으로 간주 (헤더 인식)
                const allData = XLSX.utils.sheet_to_json(allRankSheet, { range: 1 });
                log += `[정보] 전체순위 시트에서 ${allData.length}명의 생년월일 정보를 스캔합니다.\n`;
                
                allData.forEach(row => {
                    // 키 이름에 공백이 있을 수 있으므로 정리
                    const bib = cleanVal(row['배 번']);
                    const birthYear = cleanVal(row['생년월일']);
                    if (bib && birthYear) {
                        bibToBirth[bib] = birthYear;
                    }
                });
            } else {
                log += `[주의] '전체순위' 시트가 없어 Age Group 계산이 불가능할 수 있습니다.\n`;
            }

            // 2. 남/녀 시트 순회하며 데이터 수집
            let finalRecords = [];
            const sheetsToProcess = [
                { name: '남자부순위', gender: 'M' },
                { name: '여자부순위', gender: 'F' }
            ];

            sheetsToProcess.forEach(info => {
                const sheet = workbook.Sheets[info.name];
                if (!sheet) {
                    log += `[스킵] '${info.name}' 시트가 없습니다.\n`;
                    return;
                }

                // 역시 헤더가 2번째 줄(Index 1)에 있다고 가정
                const rawData = XLSX.utils.sheet_to_json(sheet, { range: 1 });
                log += `'${info.name}' 시트: ${rawData.length}명 처리 중...\n`;

                rawData.forEach(row => {
                    // 이름이나 배번호가 없으면 무효 데이터
                    const name = cleanVal(row['이  름']) || cleanVal(row['이 름']); // 공백 이슈 대응
                    const bib = cleanVal(row['배 번']);
                    
                    if (!name) return;

                    const birthYear = bibToBirth[bib];
                    const division = calcAgeGroup(birthYear, info.gender, 2025);

                    let record = {
                        n: name,
                        b: bib,
                        c: "", // 클럽 정보 없음
                        d: division,
                        rn: "한국철인_2025",
                        y: "2025",
                        rt: "Full",
                        s: parseDuration(row['SWIM']),
                        t1: parseDuration(row['T1']),
                        bk: parseDuration(row['BIKE']),
                        t2: parseDuration(row['T2']),
                        r: parseDuration(row['RUN']),
                        t: parseDuration(row['RECORDE'])
                    };
                    
                    finalRecords.push(record);
                });
            });

            if (finalRecords.length > 0) {
                saveJSON(finalRecords, "hankook_2025.json");
                document.getElementById('status').innerText = log + `\n✅ 완료! 총 ${finalRecords.length}건 변환됨. 다운로드 시작...`;
            } else {
                document.getElementById('status').innerText = log + "\n❌ 변환할 유효한 데이터가 없습니다.";
            }
        }

        // 값 정제 (문자열 앞뒤 공백 제거)
        function cleanVal(val) {
            if (val === undefined || val === null) return "";
            return String(val).trim();
        }

        // HH:MM:SS 형식을 초(Second) 단위로 변환
        function parseDuration(timeStr) {
            if (!timeStr) return 0;
            
            // 엑셀에서 넘어온 값이 숫자인 경우 (1일 = 1.0)
            if (typeof timeStr === 'number') {
                return Math.round(timeStr * 86400);
            }

            // 문자열인 경우
            const parts = String(timeStr).trim().split(':');
            if (parts.length < 2) return 0; // 형식이 안 맞으면 0

            let h = 0, m = 0, s = 0;
            if (parts.length === 3) {
                h = parseInt(parts[0]) || 0;
                m = parseInt(parts[1]) || 0;
                s = parseInt(parts[2]) || 0;
            } else if (parts.length === 2) {
                m = parseInt(parts[0]) || 0;
                s = parseInt(parts[1]) || 0;
            }

            return (h * 3600) + (m * 60) + s;
        }

        // 나이 그룹 계산 (Ironman Standard: 만 나이 기준 연도 말일)
        function calcAgeGroup(birthYear, gender, raceYear) {
            if (!birthYear) return gender === 'M' ? "M-Unk" : "F-Unk"; // 알 수 없음
            
            const birth = parseInt(birthYear);
            if (isNaN(birth)) return gender === 'M' ? "M-Unk" : "F-Unk";

            const age = raceYear - birth;
            
            // 그룹핑 로직 (5살 단위)
            // 18-24, 25-29, 30-34 ...
            let startAge;
            if (age < 18) startAge = 0;
            else if (age <= 24) startAge = 18;
            else {
                startAge = Math.floor(age / 5) * 5;
            }
            
            const endAge = startAge === 18 ? 24 : startAge + 4;
            
            return `${gender}${startAge}-${endAge}`;
        }

        function saveJSON(data, filename) {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
    </script>
</body>
</html>
