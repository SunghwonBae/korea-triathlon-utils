<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>V3 대회 데이터 통합기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">대회 데이터 통합 도구 V3 (CoachCox 지원)</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="p-4 border rounded-lg bg-blue-50">
                <label class="block text-sm font-bold text-blue-700 mb-1">1. 기존 all_records_v2.json</label>
                <input type="file" id="masterRecords" class="w-full text-sm">
            </div>
            <div class="p-4 border rounded-lg bg-green-50">
                <label class="block text-sm font-bold text-green-700 mb-1">2. 기존 race_meta_v2.json</label>
                <input type="file" id="masterMeta" class="w-full text-sm">
            </div>
        </div>

        <div class="p-4 border rounded-lg bg-yellow-50 mb-6">
            <label class="block text-sm font-bold text-yellow-700 mb-1">3. 대회 코스 타입 선택 (기본값)</label>
            <select id="raceTypeSelect" class="w-full p-2 border border-gray-300 rounded bg-white text-sm">
                <option value="Ironman">Ironman (킹코스)</option>
                <option value="Half">Half (하프코스)</option>
                <option value="Olympic" selected>Olympic (올림픽코스)</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">* 추가할 JSON 데이터 내부에 지정된 타입이 없을 경우 위 설정값이 적용됩니다.</p>
        </div>

        <div class="p-6 border-2 border-dashed border-gray-300 rounded-xl mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">4. 추가할 대회 JSON 파일들 (다중 선택)</label>
            <input type="file" id="newFiles" multiple accept=".json" class="w-full">
        </div>

        <button onclick="runMerge()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700">
            데이터 통합 및 업데이트 파일 생성
        </button>

        <div id="status" class="mt-6 p-4 bg-black text-green-400 rounded-lg font-mono text-xs h-40 overflow-y-auto">
            > 파일을 선택하고 시작 버튼을 눌러주세요.
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('status');
        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            statusBox.appendChild(div);
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        function timeToSec(val) {
            if (val === undefined || val === null || val === "") return 0;
            if (typeof val === 'number') return val;
            if (typeof val === 'string') {
                const parts = val.replace('.', ':').split(':');
                if (parts.length === 3) return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseInt(parts[2]);
                if (parts.length === 2) return parseInt(parts[0])*60 + parseInt(parts[1]);
                return parseInt(val) || 0;
            }
            return 0;
        }

        async function runMerge() {
            const fMaster = document.getElementById('masterRecords').files[0];
            const fMeta = document.getElementById('masterMeta').files[0];
            const fNews = document.getElementById('newFiles').files;
            
            const defaultRaceType = document.getElementById('raceTypeSelect').value;

            if (!fMaster || !fMeta || fNews.length === 0) {
                alert("기존 데이터 파일들과 추가할 파일을 모두 선택해주세요.");
                return;
            }

            try {
                let allRecords = JSON.parse(await fMaster.text());
                let raceMeta = JSON.parse(await fMeta.text());
                let metaIds = new Set(raceMeta.map(m => m.id));

                for (let file of fNews) {
                    log(`${file.name} 데이터 분석 중...`);
                    const data = JSON.parse(await file.text());
                    
                    // 파일명에서 연도 추출 및 확장자 제거
                    let year = file.name.match(/\d{4}/)?.[0] || new Date().getFullYear().toString();
                    let fileNameClean = file.name.replace('.json', ''); 
                    let rawName = fileNameClean.split('_')[0]; 
                    
                    let raceKo = rawName === 'hankook' ? "한국철인" : rawName === 'naju' ? "나주" : rawName === 'sun' ? "태양" : rawName;
                    let rid = `${raceKo}_${year}`;

                    data.forEach(item => {
                        // 1. CoachCox 데이터의 HTML 태그 제거 및 이름 정제
                        let parsedName = (item.n || item.name_ko || item.name || "").replace(/<[^>]*>?/gm, '').trim();

                        // 2. rt 필드 충돌 해결 (CoachCox rt는 런 기록 숫자, 기존 rt는 코스 타입)
                        let isCoachCoxRunTime = item.rt !== undefined && !isNaN(item.rt) && item.rt !== "";
                        let runTimeVal = isCoachCoxRunTime ? item.rt : (item.run || item.r);

                        // 3. 코스 타입 자동 매핑 (CoachCox rty 우선 적용)
                        let raceTypeVal = defaultRaceType;
                        if (item.rty === 'im') raceTypeVal = 'Ironman';
                        else if (item.rty === '70.3' || item.rty === 'half') raceTypeVal = 'Half';
                        else if (item.rt && isNaN(item.rt)) raceTypeVal = item.rt; // 문자열인 경우 기존 데이터 타입 적용

                        let rec = {
                            n: parsedName,
                            t: timeToSec(item.t !== undefined ? item.t : (item.ot || item.total_record || item.total || item.finish)),
                            s: timeToSec(item.s !== undefined ? item.s : (item.st || item.swim)),
                            bk: timeToSec(item.bk !== undefined ? item.bk : (item.bt || item.b1 || item.bike)),
                            r: timeToSec(item.r !== undefined ? item.r : runTimeVal),
                            t1: timeToSec(item.t1 !== undefined ? item.t1 : item.t1t),
                            t2: timeToSec(item.t2 !== undefined ? item.t2 : item.t2t),
                            rn: item.rn || rid,
                            y: item.y || year,
                            rt: raceTypeVal,
                            b: String(item.bi || item.b || item.number || ""),
                            d: item.di || item.d || item.gender || item.category || "",
                            c: item.c || item.location || "",
                            q: item.fs || item.q || item.status || item.note || ""
                        };
                        allRecords.push(rec);
                    });

                    // 메타 정보 업데이트
                    const finalRid = data[0]?.rn || rid;
                    if (!metaIds.has(finalRid)) {
                        let finalRaceType = data[0]?.rty === 'im' ? 'Ironman' : data[0]?.rty === '70.3' ? 'Half' : (data[0]?.rt && isNaN(data[0]?.rt)) ? data[0]?.rt : defaultRaceType;
                        raceMeta.push({ id: finalRid, name: finalRid, year: year, type: finalRaceType });
                        metaIds.add(finalRid);
                        log(`[신규 메타] ${finalRid} 등록 (타입: ${finalRaceType})`);
                    }
                }

                log(`통합 완료! 총 ${allRecords.length}개의 레코드가 준비되었습니다.`);
                
                // 공백 없는 압축 형식으로 다운로드
                download(allRecords, 'all_records_v2.json');
                setTimeout(() => download(raceMeta, 'race_meta_v2.json'), 800);

            } catch (e) {
                log(`에러 발생: ${e.message}`);
                alert("JSON 파일 형식을 확인해주세요.");
            }
        }

        function download(data, name) {
            const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name; a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
