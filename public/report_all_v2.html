<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철인3종 통합 리포트 V2 (AG Grid & Charts)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-charts-community/dist/ag-charts-community.min.js"></script>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; }
        .ag-theme-quartz { --ag-border-radius: 12px; height: 500px; width: 100%; }
        .chart-card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 text-white p-6 rounded-2xl shadow-xl gap-4">
            <div>
                <h1 class="text-2xl font-bold italic tracking-tight">KOREA TRIATHLON <span class="text-blue-400">ANALYTICS V2</span></h1>
                <p class="text-slate-400 text-sm mt-1">통합 데이터 기반 정밀 분석 시스템</p>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="quickFilter" placeholder="이름, 초성, 발음, 대회명 검색..." 
                       class="w-full bg-slate-800 border-none rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-white">
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="statCards">
            </div>

        <div class="chart-card">
            <div id="myGrid" class="ag-theme-quartz"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="chart-card">
                <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span class="w-1 h-4 bg-blue-500 rounded"></span> 연도별 참가자 추이
                </h3>
                <div id="yearTrendChart" style="height: 350px;"></div>
            </div>
            <div class="chart-card">
                <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span class="w-1 h-4 bg-purple-500 rounded"></span> 코스 타입별 평균 기록 (시간)
                </h3>
                <div id="typeAvgChart" style="height: 350px;"></div>
            </div>
        </div>
    </div>

    <script>
        // --- [1] 한국어 검색 지원 유틸리티 (기존 getKoreanRegex 로직 이식) ---
        const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const ROMAN_MAP = {
            'ㄱ':'g','ㄴ':'n','ㄷ':'d','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅅ':'s','ㅇ':'','ㅈ':'j','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h',
            'ㅏ':'a','ㅑ':'ya','ㅓ':'eo','ㅕ':'yeo','ㅗ':'o','ㅛ':'yo','ㅜ':'u','ㅠ':'yu','ㅡ':'eu','ㅣ':'i','ㅐ':'ae','ㅔ':'e'
        };

        function getSearchMetadata(text) {
            if (!text) return "";
            let chosung = "";
            let roman = "";
            
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i) - 44032;
                if (code >= 0 && code <= 11171) {
                    const cIdx = Math.floor(code / 588);
                    chosung += CHOSUNG[cIdx];
                    // 발음 근사치 (간소화 버전)
                    roman += ROMAN_MAP[CHOSUNG[cIdx]] || "";
                } else {
                    chosung += text[i];
                    roman += text[i];
                }
            }
            return `${chosung} ${roman}`.toLowerCase();
        }

        // --- [2] 시간 변환 유틸리티 ---
        const sToHms = (s) => {
            if(!s || isNaN(s)) return "-";
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        };

        // --- [3] AG Grid 설정 ---
        let gridApi;
        const gridOptions = {
            columnDefs: [
                { field: "n", headerName: "성명", width: 120, pinned: 'left', checkboxSelection: false },
                { field: "y", headerName: "연도", width: 90, filter: 'agNumberColumnFilter' },
                { field: "rt", headerName: "타입", width: 110 },
                { field: "rn", headerName: "대회ID", flex: 1 },
                { field: "t", headerName: "기록", width: 120, valueFormatter: p => sToHms(p.value), cellClass: 'font-mono font-bold text-blue-600' },
                { field: "s", headerName: "수영", width: 100, valueFormatter: p => sToHms(p.value) },
                { field: "bk", headerName: "바이크", width: 100, valueFormatter: p => sToHms(p.value) },
                { field: "r", headerName: "런", width: 100, valueFormatter: p => sToHms(p.value) },
                { field: "c", headerName: "클럽/소속", width: 150 },
                // 검색 전용 숨김 필드
                { field: "sk", hide: true }
            ],
            defaultColDef: { sortable: true, filter: true, resizable: true },
            pagination: true,
            paginationPageSize: 20,
            onGridReady: (params) => { gridApi = params.api; }
        };

        // --- [4] 메인 실행 로직 ---
        async function init() {
            try {
                const [recordsRes, metaRes] = await Promise.all([
                    fetch('all_records_v2.json'),
                    fetch('race_meta_v2.json')
                ]);
                
                let records = await recordsRes.json();
                const meta = await metaRes.json();

                // 런타임에 검색용 인덱스(sk) 생성
                records.forEach(r => {
                    const metaData = getSearchMetadata(r.n);
                    r.sk = `${r.n} ${metaData} ${r.rn} ${r.c || ''}`.replace(/\s+/g, ' ').toLowerCase();
                });

                // 통계 카드 업데이트
                updateStatCards(records, meta);

                // 그리드 데이터 주입
                const gridDiv = document.querySelector('#myGrid');
                gridApi = agGrid.createGrid(gridDiv, gridOptions);
                gridApi.setGridOption('rowData', records);

                // 차트 렌더링
                renderCharts(records);

                // 검색창 연결
                document.getElementById('quickFilter').addEventListener('input', (e) => {
                    gridApi.setGridOption('quickFilterText', e.target.value);
                });

            } catch (err) {
                console.error("Data Load Error:", err);
            }
        }

        function updateStatCards(records, meta) {
            const avgTime = records.reduce((acc, r) => acc + r.t, 0) / records.length;
            const stats = [
                { label: "전체 완주 기록", val: records.length.toLocaleString() + "건", color: "text-blue-600" },
                { label: "누적 대회 수", val: meta.length + "개", color: "text-green-600" },
                { label: "평균 완주 시간", val: sToHms(Math.floor(avgTime)), color: "text-orange-600" },
                { label: "최신 데이터", val: "2025-01-26", color: "text-slate-600" }
            ];
            
            document.getElementById('statCards').innerHTML = stats.map(s => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-xs font-bold mb-1 uppercase tracking-wider">${s.label}</p>
                    <p class="text-xl font-black ${s.color}">${s.val}</p>
                </div>
            `).join('');
        }

        function renderCharts(records) {
            // 차트 1: 연도별 추이
            const yearData = Object.entries(records.reduce((acc, r) => {
                acc[r.y] = (acc[r.y] || 0) + 1;
                return acc;
            }, {})).map(([y, c]) => ({ year: y, count: c })).sort((a,b) => a.year - b.year);

            agCharts.AgCharts.create({
                container: document.getElementById('yearTrendChart'),
                data: yearData,
                series: [{ type: 'line', xKey: 'year', yKey: 'count', stroke: '#3b82f6', marker: { size: 8 } }],
            });

            // 차트 2: 타입별 평균 시간
            const typeData = Object.entries(records.reduce((acc, r) => {
                if(!acc[r.rt]) acc[r.rt] = { sum: 0, cnt: 0 };
                acc[r.rt].sum += r.t;
                acc[r.rt].cnt++;
                return acc;
            }, {})).map(([type, d]) => ({ 
                type: type, 
                avg: Math.round(d.sum / d.cnt / 3600 * 10) / 10 
            }));

            agCharts.AgCharts.create({
                container: document.getElementById('typeAvgChart'),
                data: typeData,
                series: [{ type: 'bar', xKey: 'type', yKey: 'avg', fill: '#8b5cf6' }],
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
