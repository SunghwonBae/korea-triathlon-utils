<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 8px 15px; background: #03C75A; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;}
        .btn-write { background: #333; }
        a { text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <div class="header">
        <h2>📢 자유게시판</h2>
        <div>
            <a href="/api/auth/login" class="btn">N 로그인</a>
            <a href="write.html" class="btn btn-write">글쓰기</a>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th width="10%">번호</th>
                <th>제목</th>
                <th width="20%">작성자</th>
                <th width="20%">날짜</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <script>
        fetch('/api/bbs/posts')
            .then(res => res.json())
            .then(posts => {
                const html = posts.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td><a href="view.html?id=${p.id}">${p.title}</a></td>
                        <td>${p.author}</td>
                        <td>${p.date}</td>
                    </tr>
                `).join('');
                document.getElementById('list').innerHTML = html;
            });
    </script>
</body>
</html>
