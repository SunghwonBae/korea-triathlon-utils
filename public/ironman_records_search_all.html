<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironman 통합 결과 검색기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        :root { --primary-blue: #0A317E; }
        .card { background: white; border-radius: 1.5rem; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; }
        .table-container { width: 100%; overflow-x: auto; border-radius: 1rem; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: #f8fafc; padding: 1rem; font-size: 0.875rem; font-weight: 700; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 1rem; border-top: 1px solid #f1f5f9; font-size: 0.875rem; }
            .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    /* Modal content fixed height + column layout so header stays above a scrollable body */
    .modal-content { background: white; margin: 6% auto; padding: 20px; border-radius: 1rem; max-width: 800px; width: 90%; max-height: 600px; display: flex; flex-direction: column; overflow: hidden; }
    /* Scrollable body area inside modal; keep horizontal scroll for wide tables */
    #modalBody { overflow: auto; flex: 1 1 auto; }
    /* Sticky table header inside the scrollable modal body */
    #modalBody table thead th { position: sticky; top: 0; z-index: 10; background: #f1f5f9; }
        /* 슬라이드 메뉴 스타일 */
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9998; opacity: 0; visibility: hidden; transition: 0.3s; }
        .menu-overlay.is-active { opacity: 1; visibility: visible; }
        .slide-menu { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: white; z-index: 9999; transition: 0.3s; box-shadow: 2px 0 10px rgba(0,0,0,0.1); overflow-y: auto; }
        .slide-menu.is-active { left: 0; }
        .menu-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; color: white; background-color: var(--primary-blue); /* 기존 테마 색상 */ }
        .menu-header h2 { font-size: 1.2rem; font-weight: bold; margin: 0; }
        .menu-close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-link { display: block; padding: 15px 20px; text-decoration: none; color: #333; font-weight: 500; border-bottom: 1px solid #f8f9fa; transition: 0.2s; }
        .menu-link:hover { background: #f8f9fa; color: #dc2626; }
        .submenu-list .menu-link { padding-left: 40px; font-size: 0.95rem; background: #fcfcfc; }
        .type-badge { padding: 0.2rem 0.5rem; border-radius: 0.4rem; font-size: 0.7rem; font-weight: 800; margin-right: 0.5rem; }
        .badge-full { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-703 { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
        .loading-overlay { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #ef4444; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .search-container { position: sticky; top: 0; background: white; z-index: 10; padding: 1rem 0; }

        @media (max-width: 768px) {
            body { padding: 0.5rem !important; }
            .card { padding: 1rem !important; border-radius: 1rem !important; margin-bottom: 1rem !important; }
            h1 { font-size: 1.25rem !important; margin-bottom: 0.5rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .flex.flex-wrap.justify-center.gap-3.mb-6 { gap: 0.25rem !important; margin-bottom: 0.75rem !important; }
            .flex.flex-wrap.justify-center.gap-3.mb-6 button { padding: 0.25rem 0.75rem !important; font-size: 0.7rem !important; }
            .relative.max-w-md { margin-bottom: 0 !important; }
            input#globalSearch { padding: 0.5rem 1rem 0.5rem 2rem !important; font-size: 0.85rem !important; }
            .fa-search { top: 0.75rem !important; left: 0.75rem !important; font-size: 0.8rem !important; }
            .table-container { border: none; overflow-x: visible; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead { display: none; }
            tr { margin-bottom: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
            td { padding: 0 !important; border: none !important; }
            td:first-child { border-bottom: 1px solid #f1f5f9 !important; margin-bottom: 0.5rem; padding-bottom: 0.5rem !important; }
            td:first-child div { font-size: 1rem !important; }
            td:last-child div.flex-wrap { gap: 0.5rem !important; }
        }
    </style>
</head>
<body class="p-4 lg:p-12">
    <button id="menuToggle" class="fixed top-6 left-6 z-[100] bg-white border border-slate-300 rounded-lg w-10 h-10 flex justify-center items-center text-xl text-slate-700 shadow-md hover:bg-slate-50 hover:text-red-600 transition-all"><i class="fas fa-bars"></i></button>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p class="mt-4 font-bold text-slate-600">데이터를 불러오는 중입니다...</p>
    </div>

    <div class="max-w-7xl mx-auto">
        <div class="card text-center mb-8">
            <h1 class="text-3xl font-black text-slate-800 mb-4"><i class="fas fa-trophy text-red-500 mr-2"></i>Ironman 통합 검색기</h1>
            <div class="flex flex-wrap justify-center gap-3 mb-6">
                <button onclick="filterByType('all')" class="px-4 py-2 rounded-full bg-slate-800 text-white text-sm font-bold shadow-lg">전체보기</button>
                <button onclick="filterByType('full')" class="px-4 py-2 rounded-full bg-red-100 text-red-700 text-sm font-bold hover:bg-red-200">Ironman (Full)</button>
                <button onclick="filterByType('70.3')" class="px-4 py-2 rounded-full bg-blue-100 text-blue-700 text-sm font-bold hover:bg-blue-200">Ironman 70.3</button>
                <button onclick="scrollToRace('Gurye')" class="px-4 py-2 rounded-full bg-green-500 text-white text-sm font-bold hover:bg-green-600">구례</button>
                <button onclick="scrollToRace('Goseong')" class="px-4 py-2 rounded-full bg-green-500 text-white text-sm font-bold hover:bg-green-600">고성</button>
            </div>
            
            <div class="relative max-w-md mx-auto">
                <input type="text" id="globalSearch" oninput="handleSearch()" placeholder="대회 이름을 입력하세요 (예: Korea, Gurye...)" 
                    class="w-full pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:border-red-400 outline-none transition-all">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            </div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <span id="resultCount" class="text-sm font-bold text-slate-500">불러오는 중...</span>
                <button onclick="downloadAllJson()" class="text-xs font-bold text-blue-600 hover:underline"><i class="fas fa-file-download mr-1"></i>통합 JSON 다운로드</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>대회명</th>
                            <th>이름/배번 다중검색은 쉼표로 연결입력 후 엔터</th>
                        </tr>
                    </thead>
                    <tbody id="raceTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800"><i class="fas fa-user-check mr-2 text-red-500"></i>검색 결과</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-black text-2xl">&times;</button>
            </div>
            <div id="modalBody" class="overflow-x-auto"></div>
        </div>
    </div>
    <script src="menu_full_handler.js" defer></script>
    <script>
        let allRaces = []; // 통합 데이터
        let currentFilter = 'all';

        // 1. 데이터 병렬 로드
        async function loadData() {
            const overlay = document.getElementById('loadingOverlay');
            try {
                // 두 데이터를 동시에 호출 (병렬)
                const [resFull, res703] = await Promise.all([
                    fetch('/data/ironman_races.json').then(r => r.ok ? r.json() : []),
                    fetch('/data/ironman_70.3_races.json').then(r => r.ok ? r.json() : [])
                ]);

                // 데이터 구조 통합 (구분값 추가)
                const fullData = resFull.map(item => ({ ...item, type: 'full' }));
                const data703 = res703.map(item => ({ ...item, type: '70.3' }));
                
                allRaces = [...fullData, ...data703];
                renderTable(allRaces);
            } catch (e) {
                console.error('데이터 로드 실패:', e);
                alert('데이터를 불러오는데 실패했습니다.');
            } finally {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 500);
            }
        }

        // 2. 검색 및 필터링 로직
        function handleSearch() {
            const query = document.getElementById('globalSearch').value.toLowerCase();
            const filtered = allRaces.filter(race => {
                const matchesSearch = race.name.toLowerCase().includes(query);
                const matchesType = currentFilter === 'all' || race.type === currentFilter;
                return matchesSearch && matchesType;
            });
            renderTable(filtered);
        }

        function filterByType(type) {
            currentFilter = type;
            handleSearch();
        }

        // 3. 테이블 렌더링 (최적화)
        function renderTable(data) {
            const tbody = document.getElementById('raceTableBody');
            const countEl = document.getElementById('resultCount');
            countEl.innerText = `총 ${data.length}개의 대회가 검색되었습니다.`;
            
            tbody.innerHTML = data.map((item, idx) => `
                <tr id="race-${item.name.replace(/\s+/g, '-')}">
                    <td><div class="font-bold text-slate-800 whitespace-nowrap"><span class="type-badge ${item.type === 'full' ? 'badge-full' : 'badge-703'}">${item.name.replace('Ironman', '')}</span></div></td>
                    <td>
                        <div class="flex flex-wrap gap-2">
                            ${item.years.map(y => `
                                <div class="flex items-center bg-slate-50 border border-slate-200 rounded-md p-1 shadow-sm">
                                    <span class="text-[10px] font-bold px-1">${y.year}</span>
                                    <input type="text" placeholder="이름/배번" 
                                        class="w-16 text-[10px] p-0.5 border-none bg-transparent outline-none"
                                        onkeypress="if(event.keyCode==13) searchPlayer('${y.resultUrl}', this.value)">
                                    <button onclick="searchPlayer('${y.resultUrl}', this.previousElementSibling.value)" class="text-red-500 px-1">
                                        <i class="fas fa-search text-[10px]"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 4. 선수 검색 (기존 로직 유지)
        async function searchPlayer(resultUrl, rawInput) {
            if (!resultUrl || !rawInput) {
                showToast("URL과 검색어를 입력해주세요.");
                return;
            }

            // 1. 쉼표로 분리하고 공백 제거 및 소문자화
            const searchTerms = rawInput.split(',')
                .map(term => term.trim().toLowerCase())
                .filter(term => term !== "");

            // 2. Race ID 추출
            const raceIdMatch = resultUrl.match(/race\/(\d+)\//);
            const raceId = raceIdMatch ? raceIdMatch[1] : null;
            const apiUrl = `https://www.coachcox.co.uk/wp-json/imstats/v1.90/race/results/${raceId}`;

            try {
                const response = await fetch(apiUrl);
                const allData = await response.json();

                // 3. 필터링 로직 수정 (여러 키워드 중 하나라도 일치하면 포함)
                const filtered = allData.filter(item => {
                    const cleanName = (item.n || "").replace(/<[^>]*>?/gm, '').trim().toLowerCase();
                    const bibNumber = item.bi ? item.bi.toString().trim() : "";

                    // 입력한 여러 단어(searchTerms) 중 하나라도 이름에 포함되거나 배번이 일치하는지 확인
                    return searchTerms.some(term => 
                        cleanName.includes(term) || bibNumber === term
                    );
                });

                if (filtered.length === 0) {
                    showToast("검색 결과가 없습니다.");
                    return;
                }

                showResultModal(filtered);

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                showToast("데이터를 가져오는데 실패했습니다.");
            }
        }

        let currentModalData = []; // 현재 모달에 표시 중인 데이터를 담는 변수

        // 1. 결과 모달 표시 함수 (수정)
        function showResultModal(results) {
            currentModalData = results; // 검색된 데이터를 전역 변수에 저장
            renderModalTable(); // 테이블 그리기
            document.getElementById('resultModal').style.display = 'block';
        }

        // 2. 모달 내부 테이블 렌더링 함수 (추가)
        // 삭제(제외) 버튼을 클릭할 때마다 이 함수가 호출되어 화면을 갱신합니다.
        function renderModalTable() {
            const modalBody = document.getElementById('modalBody');
            
            if (currentModalData.length === 0) {
                modalBody.innerHTML = `<p class="text-center py-10 text-slate-500">표시할 데이터가 없습니다.</p>`;
                return;
            }

            let html = `
                <div class="flex justify-end mb-4 gap-2">
                    <button onclick="downloadFilteredCsv()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all">
                        <i class="fas fa-file-csv mr-2"></i>CSV 다운로드
                    </button>
                    <button onclick="downloadFilteredJson()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all">
                        <i class="fas fa-file-download mr-2"></i>현재 목록 JSON 다운로드 (${currentModalData.length}건)
                    </button>
                </div>
                <table class="min-w-full border-collapse text-xs text-center border-t border-slate-200">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="p-3 border">Bib</th>
                            <th class="p-3 border">이름</th>
                            <th class="p-3 border">연령대</th>
                            <th class="p-3 border text-red-600">Total</th>
                            <th class="p-3 border">Swim</th>
                            <th class="p-3 border">Bike</th>
                            <th class="p-3 border">Run</th>
                            <th class="p-3 border text-slate-400">제외</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            currentModalData.forEach((p, index) => {
                html += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-2 border">${p.bi}</td>
                        <td class="p-2 border font-bold">${p.n.replace(/<[^>]*>?/gm, '')}</td>
                        <td class="p-2 border">${p.di || '-'}</td>
                        <td class="p-2 border text-red-600 font-bold">${p.fs === "DNF" ? "DNF" : formatSeconds(p.ot)}</td>
                        <td class="p-2 border">${formatSeconds(p.st)}</td>
                        <td class="p-2 border">${formatSeconds(p.bt)}</td>
                        <td class="p-2 border">${formatSeconds(p.rt)}</td>
                        <td class="p-2 border">
                            <button onclick="removeDataFromModal(${index})" class="text-slate-300 hover:text-red-500 transition-colors">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>`;
            });

            html += `</tbody></table>`;
            modalBody.innerHTML = html;
        }

        // 3. 행 삭제 함수 (추가)
        function removeDataFromModal(index) {
            if (confirm("이 기록을 목록에서 제외하시겠습니까?")) {
                currentModalData.splice(index, 1); // 해당 인덱스의 데이터 삭제
                renderModalTable(); // 화면 다시 그리기
            }
        }

        // 5. 필터링된 데이터 CSV 다운로드 함수 (추가)
        function downloadFilteredCsv() {
            if (currentModalData.length === 0) return;

            let csvContent = "\uFEFFBib,Name,Division,Total,Swim,Bike,Run,Status\n";
            
            currentModalData.forEach(p => {
                const row = [
                    p.bi,
                    `"${p.n.replace(/<[^>]*>?/gm, '').replace(/"/g, '""')}"`,
                    p.di || '-',
                    p.fs === "DNF" ? "DNF" : formatSeconds(p.ot),
                    formatSeconds(p.st),
                    formatSeconds(p.bt),
                    formatSeconds(p.rt),
                    p.fs
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ironman_custom_results_${new Date().getTime()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 4. 필터링된 데이터 JSON 다운로드 함수 (추가)
        function downloadFilteredJson() {
            if (currentModalData.length === 0) return;

            const dataStr = JSON.stringify(currentModalData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `ironman_custom_results_${new Date().getTime()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        const formatSeconds = (s) => {
            if (!s || s === "0" || isNaN(s)) return "-";
            const res = new Date(s * 1000).toISOString().substr(11, 8);
            return res.startsWith("00:") ? res.substr(3) : res;
        };

        function closeModal() { document.getElementById('resultModal').style.display = 'none'; }
        function scrollToRace(name) {
            const target = Array.from(document.querySelectorAll('td div.font-bold')).find(el => el.textContent.includes(name));
            if(target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function downloadAllJson() {
            const blob = new Blob([JSON.stringify(allRaces, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ironman_all_races_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        window.onload = loadData;
    </script>
</body>
</html>
