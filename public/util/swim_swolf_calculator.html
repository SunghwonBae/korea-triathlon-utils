<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="https://korea-triathlon-utils.vercel.app/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://korea-triathlon-utils.vercel.app/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://korea-triathlon-utils.vercel.app/favicon/favicon-16x16.png">
    <link rel="manifest" href="https://korea-triathlon-utils.vercel.app/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수영 SWOLF 효율 분석기</title>
    <link rel="stylesheet" href="/css/bucheonTriStyle.css">
    <script src="/js/ui_utils.js"></script>
    <script src="/menu/menu_full_handler.js" defer></script>
    <script src="/js/back_exit_handler.js" defer></script>
    <script src="/bbs/bbs_layer.js" defer></script>
    
    <style>
        :root {
            --swolf-purple: #9b59b6;
            --efficiency-good: #2ecc71;
            --efficiency-avg: #f1c40f;
            --efficiency-low: #e67e22;
            --track-bg: #dfe6e9;
        }

        .slider-container { margin-bottom: 35px; position: relative; padding: 0 10px; }
        .slider-label { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; color: #34495e; }
        .slider-val { color: var(--swolf-purple); font-size: 1.2em; font-family: monospace; }

        input[type=range] {
            width: 100%; cursor: pointer; height: 10px; border-radius: 5px; 
            background: var(--track-bg); -webkit-appearance: none; appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: #fff; border: 3px solid var(--swolf-purple); border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .summary-box { display: grid; grid-template-columns: 1fr; gap: 10px; background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 2px solid var(--swolf-purple); }
        .sum-item span { display: block; font-size: 0.9em; color: #7f8c8d; margin-bottom: 5px; }
        .sum-item strong { display: block; font-size: 2.8em; color: var(--swolf-purple); line-height: 1.1; }
        .efficiency-label { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9em; color: white; }

        .info-panel { background: #f3f0f7; border-left: 5px solid var(--swolf-purple); padding: 15px; border-radius: 8px; font-size: 0.85em; line-height: 1.6; color: #6c5b7b; margin-bottom: 25px; }
        
        .pool-selector { display: flex; gap: 10px; margin-bottom: 25px; }
        .pool-btn { flex: 1; padding: 12px; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .pool-btn.active { background: var(--swolf-purple); color: white; border-color: var(--swolf-purple); }

        .gauge-container { height: 12px; background: #eee; border-radius: 6px; margin: 20px 0; overflow: hidden; display: flex; }
        .gauge-segment { height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <button id="menuToggle" class="menu-btn" aria-label="메뉴 열기">☰</button>
        <h1 style="flex:1; margin-left:10px;">📉 SWOLF 분석기</h1>
    </div>

    <div class="info-panel">
        <strong>SWOLF란?</strong><br>
        수영장 한 바퀴의 <strong>시간(초) + 스트로크 횟수</strong>를 합친 값입니다. 점수가 낮을수록 적은 힘으로 멀리 가는 '효율적인 수영'을 하고 있다는 증거입니다.
    </div>

    <div class="controls" style="background:#fff; padding:25px 15px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-bottom:20px;">
        <div style="margin-bottom: 15px; font-weight: bold; color: #34495e;">1. 수영장 길이 선택</div>
        <div class="pool-selector">
            <button class="pool-btn active" data-len="25">25m 풀</button>
            <button class="pool-btn" data-len="50">50m 풀</button>
        </div>

        <div class="slider-container">
            <div class="slider-label"><span>소요 시간 (초)</span><span class="slider-val"><span id="disp-time">25</span> 초</span></div>
            <input type="range" id="in-time" min="10" max="100" step="1" value="25">
        </div>

        <div class="slider-container">
            <div class="slider-label"><span>스트로크 횟수 (한 팔당 1회)</span><span class="slider-val" id="disp-stroke">18 회</span></div>
            <input type="range" id="in-stroke" min="5" max="60" step="1" value="18">
        </div>
    </div>

    <div class="summary-box">
        <div class="sum-item">
            <span>나의 SWOLF 점수</span>
            <strong id="swolf-score">43</strong>
            <div id="efficiency-tag" class="efficiency-label" style="background: var(--efficiency-good);">매우 효율적</div>
        </div>
    </div>

    <div style="padding: 10px;">
        <h4 style="margin: 0 0 10px 0; color: #2c3e50; font-size: 0.9em;">점수 분포 가이드 (25m 기준)</h4>
        <div class="gauge-container">
            <div class="gauge-segment" style="width: 30%; background: #2ecc71;"></div>
            <div class="gauge-segment" style="width: 30%; background: #f1c40f;"></div>
            <div class="gauge-segment" style="width: 40%; background: #e67e22;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.75em; color: #7f8c8d;">
            <span>35미만 (선수급)</span>
            <span>45 (상급)</span>
            <span>55이상 (교정필요)</span>
        </div>
    </div>
</div>

<script>
    const elTime = document.getElementById('in-time');
    const elStroke = document.getElementById('in-stroke');
    const dispTime = document.getElementById('disp-time');
    const dispStroke = document.getElementById('disp-stroke');
    const swolfScore = document.getElementById('swolf-score');
    const efficiencyTag = document.getElementById('efficiency-tag');
    const poolBtns = document.querySelectorAll('.pool-btn');

    let poolLength = 25;

    function update() {
        const time = parseInt(elTime.value);
        const stroke = parseInt(elStroke.value);
        
        dispTime.textContent = time;
        dispStroke.textContent = stroke;

        // SWOLF = 시간 + 스트로크 수
        const score = time + stroke;
        swolfScore.textContent = score;

        // 효율성 판단 (25m 풀 기준 일반적인 가이드)
        // 50m 풀일 경우 기준치를 약 2배 조정
        let level = "";
        let color = "";
        const base = poolLength === 25 ? 1 : 1.8;

        if (score < 40 * base) {
            level = "우수 (Excellent)";
            color = "var(--efficiency-good)";
        } else if (score < 50 * base) {
            level = "보통 (Good)";
            color = "#27ae60";
        } else if (score < 65 * base) {
            level = "노력 필요 (Average)";
            color = "var(--efficiency-avg)";
        } else {
            level = "교정 권장 (Poor)";
            color = "var(--efficiency-low)";
        }

        efficiencyTag.textContent = level;
        efficiencyTag.style.background = color;
    }

    poolBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            poolBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            poolLength = parseInt(btn.dataset.len);
            
            // 50m 선택 시 기본 슬라이더 값 조정
            if (poolLength === 50) {
                if (elTime.value < 40) elTime.value = 50;
                if (elStroke.value < 30) elStroke.value = 40;
            } else {
                if (elTime.value > 40) elTime.value = 25;
                if (elStroke.value > 30) elStroke.value = 18;
            }
            update();
        });
    });

    elTime.oninput = update;
    elStroke.oninput = update;

    // 초기 실행
    update();
</script>
</body>
</html>
